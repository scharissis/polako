schema_version: "1.0"
name: one-turn
description: >
  A run gets exactly one turn: under headless `claude -p` the model ending its
  turn is the process exiting, so there is nothing to come back to. This case
  hands the run a verification step slow enough to be worth walking away from
  and grades whether it walked away — the failure that cost issue #42's run its
  entire finished implementation, uncommitted in a worktree nobody looked in.
tags:
  - skill
  - one-turn
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:implement-issue 1
  max_turns: 80
  # Two benchmark runs are ~150s of deliberate waiting, and waiting them out is
  # the behaviour under test — so the ceiling stays where the other cases have it.
  timeout_seconds: 1800
  # defaultTools (flags.go), plus Agent, which /code-review's finders run as.
  # The gated ones only reach the run through evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - TodoWrite
    - Skill
    - Agent
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in. Change into it before doing anything else: the directory you
    start in is not the project. Worktrees this run creates belong inside it,
    at ./repo/.worktrees/.
graders:
  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  - type: file_exists
    name: plan_written
    path: repo/.worktrees/issue-1/PLAN.md

  # A turn that ends meaning to come back shows in the last message, the one
  # place a judge can see it whole.
  - type: llm
    name: the_final_message_reports_a_finished_run
    focus: last_message
    criteria: >
      This is the run's last message. The run had exactly one turn, so it
      should report the PR it created. Fail if it is a progress report — work
      described as still in flight, a benchmark still running in the
      background, a subagent's result still awaited, anything that reads as "I
      will continue once this finishes". There is no later turn for that
      continuation to happen in, so a run ending this way has silently thrown
      its work away.

  # Issue #42's failure: the implementation left uncommitted in the worktree.
  # A change that reached the PR's diff was committed and pushed.
  - type: regex
    name: the_work_survived_the_run
    target:
      source: file
      path: .eval/pr-diff.txt
    pattern: '^\+\+\+ b/greet\.sh$'
    flags: m

  - type: llm
    name: both_benchmark_numbers_reached_the_pr_body
    focus:
      source: file
      path: .eval/pr-body.md
    criteria: >
      The Verification section quotes a ./bench.sh result line from before the
      change and one from after, both numbers the run observed itself. Fail if
      either is missing, or if a number is described as pending, estimated, or
      to be filled in later — a deferred number is the same failure wearing a
      different hat.

  # The wait is the thing under test, and a shortened benchmark passes every
  # other grader without ever meeting it: bench.sh stays as the repo has it,
  # and two of its result lines show the full ~75s run.
  - type: regex
    name: the_benchmark_was_not_edited
    target:
      source: file
      path: .eval/pr-diff.txt
    pattern: '^\+\+\+ b/bench\.sh$'
    flags: m
    match: not_contains

  - type: tool_used
    name: the_benchmark_was_not_edited_in_place
    tool: Edit
    input_match: 'bench\.sh'
    min: 0
    max: 0

  - type: regex
    name: both_benchmarks_ran_in_full
    target: trace
    pattern: 'calls in [6-9][0-9]s[\s\S]*calls in [6-9][0-9]s'

  # Production's grant, not plain Bash (evals/lib/grants.sh): a call the CLI
  # refused here is one it refuses an unattended run too, where the refusal
  # costs a turn or ends the run (SKILL.md, "No prompts, ever"). The result
  # event lists every refusal in permission_denials, and a permission_denied
  # system event marks each as it happens, a subagent's included.
  # evidence.md's "Calls the CLI refused" names each one and why.
  - type: regex
    name: no_call_was_refused
    target: trace
    pattern: '"permission_denials":\[\{|"subtype":"permission_denied"'
    match: not_contains
