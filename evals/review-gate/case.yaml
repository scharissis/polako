name: review-gate
description: >
  The review gate is mandatory and it comes before the PR. This case grades the
  ordering, not the code: a gate that runs after `gh pr create` reviews a change
  a human is already looking at.
prompt: /polako:implement-issue 1
scaffold_script: scaffold.sh
runs: 1
max_turns: 80
timeout_seconds: 1800
tags:
  - skill
  - gate
graders:
  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  - type: llm
    name: review_ran_before_the_pr
    focus: the order of the review gate and the PR in the transcript
    criteria: >
      The run reviewed its own diff before it ran `gh pr create` — either by
      invoking /code-review, or, for a small enough diff, by doing the
      skill's cheap-path self-review pass instead (SKILL.md's Phase 3 step 2c
      names a diff under 30 changed lines as the threshold for this). If the
      code-review skill was not invocable in this session, the run must have
      said so explicitly and then done a substitute review pass over its own
      diff — that fallback counts as passing too. Fail if the PR was created
      with no review of any kind, or if the review came after the PR.

  - type: llm
    name: review_was_aimed_at_this_branch
    focus: how /code-review was invoked, if it was invoked at all
    criteria: >
      This only applies if the run actually invoked /code-review (a `medium`
      or `high` diff) — if the diff was small enough for the cheap
      self-review path, there is no invocation to check and this passes by
      default. When /code-review was invoked, the invocation must have named
      the branch (issue-1) as its target, and must not have passed --fix (the
      gate now applies findings itself, one at a time, so it can checkpoint
      between them — see SKILL.md's Phase 3 step 2). Fail if /code-review was
      invoked bare, which reviews whatever the main checkout holds rather
      than this branch, or if --fix was passed.

  - type: llm
    name: base_was_refreshed_first
    focus: whether the local default branch was brought up to date before review
    criteria: >
      Before reviewing the diff (whether by invoking /code-review or by the
      cheap self-review path), the run ran `git merge --ff-only` against the
      origin ref in the main checkout, or established that it was unnecessary or
      that the checkout was not on the default branch. Fail if the run forced
      the update with reset, rebase or a non-fast-forward merge.

  - type: llm
    name: review_level_scaled_to_the_diff
    focus: how the run chose the review level
    criteria: >
      Before reviewing, the run sized the change (e.g. `git diff --stat`
      against the origin ref) and picked the level from it — `cheap` under 30
      changed lines, `medium` from 30 through 299, `high` at 300 or more —
      rather than always asking for `high`. The run should have stated which
      level it picked and the line count behind it. The scaffold's diff is
      small, so either `cheap` (with a self-review pass instead of an
      invocation) or `medium` is the expected choice; `high` with a stated
      reason also passes. Fail only if the run gave no sign of sizing the
      change, or asked for `high` with no rationale.

  - type: llm
    name: the_review_wait_was_not_hand_polled
    focus: the tool-call timeline while the run was at the review gate
    criteria: >
      Getting through the review gate — whether by invoking /code-review or by
      the cheap-path self-review — the run did not hand-poll. SKILL.md's
      Phase 3 step 2c now covers two shapes, and both are fine: a
      /code-review call whose return already carries findings, acted on with
      nothing in between (issues #217, #372's failure — polling a call that
      was always going to block); or a call whose return only reports
      background finder subagents still running, waited out slowly — a check
      every minute or two, not seconds (issue #472's failure — treating that
      kind of return as the findings and moving on before the work was
      actually done). Fail on either extreme: a burst of polling filler run
      back to back with no real work between calls — several `ListAgents`
      calls, trivial `Bash` (`true`, bare `sleep`), or a bare `Monitor`
      heartbeat loop seconds apart — or a run that acted on a return
      describing background work (subagents still fanning out, no findings
      yet handed back) as though it were the finished review. Pass if the
      diff took the cheap path and there was no wait to poll at all, if the
      run reached its review and moved straight on to real findings, or if it
      waited out a genuinely backgrounded review at the slow cadence.

  - type: llm
    name: review_findings_survive_the_gate
    focus: PLAN.md's `## Review` section at the point the run reaches Phase 3 step 2d or opens the PR
    criteria: >
      If the review gate found anything (a /code-review invocation or the
      cheap self-review pass produced findings, however few), those findings
      are present in PLAN.md's `## Review` section by the time the run acts on
      them or opens the PR — not merely mentioned in the run's own prose.
      This is issue #472's failure mode: a run whose /code-review call came
      back reporting background subagents still running, that noted each
      finder's result in the transcript as it arrived but never wrote any of
      it to PLAN.md, and ended its turn with `## Review` still empty or
      missing while the findings existed only in the transcript. Fail only on
      that shape — findings visibly discussed by the run but never
      checkpointed to disk. Pass if the review found nothing, if `## Review`
      holds the findings (whether written in one pass or checkpointed as
      "pending, unverified" while a backgrounded review was still running),
      or if the run never got far enough to invoke the review at all (an
      earlier grader already covers that separately).

  - type: tool_used
    tool: Skill
