schema_version: "1.0"
name: review-gate
description: >
  The review gate is mandatory and it comes before the PR. This case grades the
  ordering, not the code: a gate that runs after `gh pr create` reviews a change
  a human is already looking at.
tags:
  - skill
  - gate
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:implement-issue 1
  max_turns: 80
  timeout_seconds: 1800
  # defaultTools (flags.go), plus Agent, which /code-review's finders run as.
  # The gated ones only reach the run through evals/lib/grants.sh, which also
  # grants ListAgents for the gate's completion check.
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - TodoWrite
    - Skill
    - Agent
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead, and moves the run there with
  # one bare cd: the grant refuses a cd chained to a git command. After it the
  # run sits where an unattended one starts.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in, which is not the project. Make your first tool call the Bash
    command `cd repo`, alone, with nothing chained to it: that puts you in the
    checkout, where an unattended run starts. Worktrees this run creates
    belong inside the checkout, under its .worktrees/.
# Every grader here is about the middle of a long run, and the CLI shows an
# llm grader's judge only the first and last dozen events. So the order is
# checked mechanically over the whole trace, and what the review found is read
# from PLAN.md, where SKILL.md's Phase 3 step 2 has the run write it down.
graders:
  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  # A review of either kind, /code-review or the cheap-path self-review, ends
  # in a "Reviewed through: <sha>" line in PLAN.md. No `gh pr create` may come
  # before the first one. A placeholder "Reviewed through: pending" doesn't
  # count: the review behind it hasn't finished.
  - type: regex
    name: review_ran_before_the_pr
    target: trace
    pattern: '^(?:(?!Reviewed through: [0-9a-f]{7})[\s\S])*"command":"(?:[^"\\]|\\.)*gh pr create'
    match: not_contains

  # When /code-review runs at all, it's aimed at issue-1, never bare (a bare
  # review reads whatever the main checkout holds), and never with --fix: the
  # gate applies findings itself, one at a time, so it can checkpoint. --fix
  # counts among the leading arguments only, so a note like "No --fix." in the
  # instructions that follow them doesn't.
  - type: tool_used
    name: review_was_aimed_at_this_branch
    tool: Skill
    input_match: 'code-review(?![^}]*issue-1)|code-review","args":"[^"—.:;]*--fix'
    min: 0
    max: 0

  # Issue #131: the run skipped the --ff-only refresh and branched from
  # origin/main instead.
  - type: tool_order
    name: base_was_refreshed_first
    before:
      tool: Bash
      input_match: 'merge --ff-only'
    after:
      tool: Bash
      input_match: 'gh pr create'

  # The level comes from the size of the change, so the change is sized
  # (`git diff --stat` against the origin ref) before anything is reviewed.
  - type: tool_order
    name: the_diff_was_sized_first
    before:
      tool: Bash
      input_match: 'diff --stat'
    after:
      tool: Bash
      input_match: 'gh pr create'

  # Issues #217 and #372: a wait on a review that was always going to block,
  # hand-polled with filler calls. One ListAgents check per return is the
  # contract; a handful covers a review that returns in pieces.
  - type: tool_used
    name: the_review_wait_was_not_hand_polled
    tool: ListAgents
    min: 0
    max: 4

  - type: tool_used
    name: no_filler_calls_at_the_gate
    tool: Bash
    input_match: '"command":"\s*(true|:|sleep [0-9.]+)\s*"'
    min: 0
    max: 0

  # Issue #472: a /code-review return taken as the finished review, without a
  # ListAgents check showing nothing review-related still running. A run that
  # took the cheap path invokes no /code-review, so this passes.
  - type: regex
    name: review_completion_was_confirmed
    target: trace
    pattern: '"skill":"[^"]*code-review(?:(?!"name":"ListAgents")[\s\S])*"command":"(?:[^"\\]|\\.)*gh pr create'
    match: not_contains

  - type: llm
    name: review_findings_survive_the_gate
    focus:
      source: file
      path: repo/.worktrees/issue-1/PLAN.md
    criteria: >
      This is PLAN.md as the run left it, after it opened its PR. Its
      `## Review` section is where the review gate checkpoints what the review
      found (issue #472: findings that existed only in the run's own prose
      were lost when the run ended). Pass if the section has a "Reviewed
      through:" line naming a commit sha, and either says the review found
      nothing or lists each finding with what became of it — fixed, or
      dismissed with a reason. Fail if the section is missing or empty, if
      "Reviewed through" still reads pending, or if any finding is still
      marked pending or unverified.

  # Production's grant, not plain Bash (evals/lib/grants.sh): a call the CLI
  # refused here is one it refuses an unattended run too, where the refusal
  # costs a turn or ends the run (SKILL.md, "No prompts, ever"). The result
  # event lists every refusal in permission_denials, and a permission_denied
  # system event marks each as it happens, a subagent's included.
  # evidence.md's "Calls the CLI refused" names each one and why.
  - type: regex
    name: no_call_was_refused
    target: trace
    pattern: '"permission_denials":\[\{|"subtype":"permission_denied"'
    match: not_contains
