schema_version: "1.0"
name: resume-existing-plan
description: >
  A run that finds an existing worktree and a finished PLAN.md should resume
  from it. Re-planning is not merely wasteful — it discards the decisions the
  previous run already made, which is the whole reason the plan is written to
  disk before the code.
tags:
  - skill
  - resume
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:implement-issue 1
  max_turns: 80
  timeout_seconds: 1800
  # defaultTools (flags.go), plus Agent, which /code-review's finders run as.
  # The gated ones only reach the run through evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - TodoWrite
    - Skill
    - Agent
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in. Change into it before doing anything else: the directory you
    start in is not the project. Worktrees this run creates belong inside it,
    at ./repo/.worktrees/.
graders:
  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  # The run found the existing issue-1 worktree and worked in it: no second
  # worktree, no branch recreated from the default branch, nothing discarded.
  - type: tool_used
    name: existing_worktree_was_reused
    tool: Bash
    input_match: 'worktree (add|remove)|branch -[dDfM]\b|checkout -B|switch -C'
    min: 0
    max: 0

  - type: llm
    name: the_existing_plan_was_kept
    focus:
      source: file
      path: repo/.worktrees/issue-1/PLAN.md
    criteria: >
      This is PLAN.md as the run left it. A previous run wrote it as a finished
      plan for a --shout flag, and this run was meant to resume from it. Pass
      if its decisions still stand: upper-casing with `tr` rather than a bash
      `${var^^}` expansion because greet.sh is POSIX sh, the files it names,
      and the short `-s` alias left out. Progress notes, a review section or
      other additions are fine. Fail if it reads as a freshly written plan that
      replaced those decisions, or if it drops or reverses one without saying
      why.

  # The plan's POSIX-sh decision, surviving into the code.
  - type: regex
    name: upper_casing_uses_tr
    target:
      source: file
      path: repo/.worktrees/issue-1/greet.sh
    pattern: '\btr\b'

  - type: regex
    name: no_bash_case_expansion
    target:
      source: file
      path: repo/.worktrees/issue-1/greet.sh
    pattern: '\^\^'
    match: not_contains

  - type: llm
    name: the_scoped_out_alias_stayed_out
    focus:
      source: file
      path: repo/.worktrees/issue-1/greet.sh
    criteria: >
      greet.sh does not accept a `-s` alias for `--shout`. The plan
      deliberately left it out, and a resumed run adding it anyway is a run
      that read the plan as notes rather than as decisions already taken.
