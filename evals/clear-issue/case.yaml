schema_version: "1.0"
name: clear-issue
description: >
  A well-specified issue should go all the way to a PR without stopping to ask
  anything — and should still write the plan first.
tags:
  - skill
  - happy-path
# One run keeps a full plan-to-PR cycle affordable. Pass --runs 3 when you care
# whether a case is flaky rather than whether it works at all.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:implement-issue 1
  max_turns: 80
  timeout_seconds: 1800
  # defaultTools (flags.go), plus Agent, which /code-review's finders run as.
  # The gated ones only reach the run through evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - TodoWrite
    - Skill
    - Agent
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead, and moves the run there with
  # one bare cd: the grant refuses a cd chained to a git command. After it the
  # run sits where an unattended one starts.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in, which is not the project. Make your first tool call the Bash
    command `cd repo`, alone, with nothing chained to it: that puts you in the
    checkout, where an unattended run starts. Worktrees this run creates
    belong inside the checkout, under its .worktrees/.
graders:
  - type: file_exists
    name: plan_written
    path: repo/.worktrees/issue-1/PLAN.md

  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  # Mid-run order is checked over every tool call, not by a judge: the CLI
  # shows an llm grader's judge only the first and last dozen events.
  - type: tool_order
    name: plan_preceded_the_code
    before:
      tool: Write
      input_match: '"file_path":"(?:[^"\\]|\\.)*PLAN\.md"'
    after:
      tool: Bash
      input_match: '"command":"(?:[^"\\]|\\.)*git\b(?:[^"\\]|\\.)*\bcommit\b'

  - type: llm
    name: pr_body_is_complete
    focus:
      source: file
      path: .eval/pr-body.md
    criteria: >
      The body has, at minimum, Summary, Evidence and Verification, and
      "Closes #1" sits on its own line after every section. A trailing
      attribution line after it (such as "Generated with Claude Code") is
      fine — Claude Code appends one — so do not fail the body for it. Fail
      if any of those three sections is missing, if the body is a bare diff
      summary, or if the closing line is absent, shares a line with other
      text, or is buried mid-paragraph. Design decisions and Scope are
      optional — the skill omits either when there's nothing to report — so
      do not fail the body for lacking one or both of them. The issue's own
      change is exactly the kind Evidence exists for: `--help` printing a
      usage line is visible CLI output, so fail if Evidence is missing or
      empty. Also fail if it reads like a bare prose description of the
      output rather than a captured fenced block, or like an
      invented/hand-typed line rather than something the run actually ran
      and observed — judge this by whether it reads like a real terminal
      transcript, not by matching an exact wording; the issue only requires
      a usage line naming the script and its one argument, not a specific
      spelling of either.

  # The issue is specified well enough to implement, so no question and no
  # awaiting-answer label.
  - type: regex
    name: no_question_was_asked
    target:
      source: file
      path: .eval/labels.log
    pattern: 'add awaiting-answer'
    match: not_contains

  # greet.sh has no browser-rendered files and no package.json, so nothing
  # here is visual: a plain script fix has no business starting a server or
  # touching polako-evidence. That's the ref, not the `.polako-evidence`
  # scratch dir: SKILL.md's read-only check that no shots reached the branch
  # names the dir, and runs whether anything was shot or not (issue #703).
  - type: tool_used
    name: no_dev_server_or_evidence_ref
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*(?:npm run|http\.server|playwright|[^.]polako-evidence)'
    min: 0
    max: 0

  # Production's grant, not plain Bash (evals/lib/grants.sh): a call the CLI
  # refused here is one it refuses an unattended run too, where the refusal
  # costs a turn or ends the run (SKILL.md, "No prompts, ever"). The result
  # event lists every refusal in permission_denials, and a permission_denied
  # system event marks each as it happens, a subagent's included.
  # evidence.md's "Calls the CLI refused" names each one and why.
  - type: regex
    name: no_call_was_refused
    target: trace
    pattern: '"permission_denials":\[\{|"subtype":"permission_denied"'
    match: not_contains
