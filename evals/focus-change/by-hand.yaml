# by-hand.yaml, not case.yaml, for visual-change's reason: a run here fetches
# Playwright and a Chromium through npx, and the CLI's sandbox locks the run's
# shell away from the network, so only evals/run.sh runs this case.
schema_version: "1.0"
name: focus-change
description: >
  A visual change a URL shot can't show: the fix is a focus ring, visible only
  after Tab. The run must still shoot the page as it loads, not skip evidence,
  and its PR must name the focus state as something the shots don't show.
tags:
  - skill
  - visual-evidence
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:implement-issue 1
  max_turns: 80
  timeout_seconds: 1800
  # defaultTools (flags.go), plus Agent, which /code-review's finders run as.
  # The gated ones only reach the run through evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - TodoWrite
    - Skill
    - Agent
    - Bash
  # CLAUDE.md loading is off for a run, so the workspace can't say where the
  # project is. This says it instead.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in. Change into it before doing anything else: the directory you
    start in is not the project. Worktrees this run creates belong inside it,
    at ./repo/.worktrees/.
graders:
  - type: file_exists
    name: pr_opened
    path: .eval/pr-body.md

  # Still `capture`, never `skip`: the static page is shot and published even
  # though it can't show the ring.
  - type: llm
    name: evidence_link_names_a_real_evidence_commit
    focus:
      source: file
      path: .eval/pr.md
    criteria: >
      The PR body embeds an image link shaped like
      /blob/<40-hex-sha>/issue-1/<sha7>/....png?raw=true — a full 40-character
      commit SHA, not a short one and not a placeholder. That SHA names a real
      commit on origin's polako-evidence branch: cross-check it against the
      `=== origin refs ===` and `=== polako-evidence tree ===` sections below
      the body. Fail if the body has no such link, if the SHA isn't 40 hex
      characters, or if it doesn't match origin's polako-evidence ref.

  - type: llm
    name: pr_names_the_focus_state_the_shots_miss
    focus:
      source: file
      path: .eval/pr-body.md
    criteria: >
      The PR body says, in plain words, that the screenshots don't show the
      focus ring (or the keyboard-focus state), and says how to check it by
      hand — for example by pressing Tab to reach the button. Pass only if both
      are there. Fail if the body claims the screenshots show the ring, or
      never mentions that they can't.

  - type: regex
    name: no_scratch_or_png_committed_on_issue_branch
    target:
      source: file
      path: .eval/pr-diff.txt
    pattern: '^\+\+\+ b/.*(\.png|\.polako-evidence)'
    flags: m
    match: not_contains

  - type: tool_used
    name: only_loopback_was_shot
    tool: Bash
    input_match: 'playwright screenshot(?:[^"\\]|\\.)*https?://(?!(127\.0\.0\.1|localhost)[:/])'
    min: 0
    max: 0
