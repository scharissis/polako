schema_version: "1.0"
name: review-health
description: >
  A repository's structural problems should become proposals — every one
  labelled, sized and pointered, each finding resting on a measurement or a
  named location rather than a vibe, the missing size gate proposed as its own
  issue, and the overlap the backlog already covers left alone. A prompt file
  written for an older model gets a proposal too, without losing the one rule
  in it that carries a reason, and polako's own CLAUDE.md block is left out.
  Nothing but issues is created.
tags:
  - skill
  - planning
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:review-health .
  max_turns: 60
  timeout_seconds: 1800
  # healthTools (health.go): Skill(claude-api) is the prompt audit. The gated
  # ones only reach the run through evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Glob
    - Grep
    - TodoWrite
    - Skill(claude-api)
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead, and moves the run there with
  # one bare cd: the grant refuses a cd chained to a git command. After it the
  # run sits where an unattended one starts.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in, which is not the project. Make your first tool call the Bash
    command `cd repo`, alone, with nothing chained to it: that puts you in the
    checkout, where an unattended run starts. Worktrees this run creates
    belong inside the checkout, under its .worktrees/.
# .eval/issues-created.md holds every recorded issue, one after another, each
# with its number, argv, title, labels and parent lines above a --- and its
# body below.
graders:
  - type: file_exists
    name: something_was_proposed
    path: .eval/created/100.md

  - type: llm
    name: everything_carries_the_gate_label
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Every recorded issue was created with `--label proposed` — check the
      `labels:` line and the `argv:` line of each one. Fail if even one is
      missing it: the label is the only thing keeping an unattended run off an
      issue no human has approved, so one unlabelled proposal is one that gets
      worked without anybody choosing it.

  - type: llm
    name: the_epic_is_parented_correctly
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge parenting only: each recorded issue's number, its `parent:` line,
      and any `--parent` in its argv. A `--blocked-by` link is a dependency
      between issues, not parenting, and counts neither way. Either every
      created issue is flat with no `--parent` at all, or exactly one is the
      epic and the rest name it — the epic has an empty `parent:` line and the
      lowest number, and each child's `parent:` is that number. Fail if a
      child names a number that was never created, if the epic was created
      after a child that parents to it, or if two different parents appear.

  - type: llm
    name: bodies_are_complete
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge each recorded issue's body, below its --- line. Each body has
      Summary, Why now, Acceptance criteria, Pointers and Out of scope
      sections, one `Estimate: S|M|L — likely N runs` line, and a closing
      provenance line naming the repository and a short commit sha. The
      Pointers section names real files from the scratch repo (handlers.sh,
      notify.sh, test.sh, greet.sh, deploy.sh, README.md, CLAUDE.md,
      skills/deploy/SKILL.md). Fail on a body that is a paragraph of prose, on
      an estimate quoting a dollar figure, or on acceptance criteria that
      restate the summary rather than saying when the issue is done.

  - type: llm
    name: findings_rest_on_a_measurement_or_location
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge the Summary, Why now and Pointers sections of each recorded issue.
      Every finding cites something concrete a reader could verify — a line
      count against the rest of the tree, a named set of near-duplicate
      functions (notify_slack / notify_email / notify_sms), a specific file
      holding two unrelated jobs, or — for a prompt file — the quoted text and
      the named pattern it matches. Fail on any proposal justified only by a
      subjective judgement ("this feels messy", "the code is hard to read")
      with no measurement or named location behind it.

  - type: llm
    name: the_missing_size_gate_was_proposed
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      The scratch repo has no size-budget or complexity check of its own —
      test.sh asserts behaviour only. Exactly one recorded issue proposes
      adding such a check (a size budget, a length limit, a complexity gate)
      in the repo's own test runner, and its body describes the ratchet /
      allowlist pattern where listed offenders only ever come off. Fail if no
      issue proposes the gate, or if the proposal is just "add linting" with
      no mechanism.

  - type: llm
    name: the_seeded_overlap_was_not_reproposed
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Open issue #1 already asks for handlers.sh to be split into a parsing file
      and a rendering file, and the same split is an obvious finding from the
      code. No recorded issue proposes that split again, even reworded — a
      duplicate costs the curator a decision and the queue a wasted run.
      Proposing the notify.sh duplication and the missing size gate is correct
      and is not a failure here.

  - type: llm
    name: the_planted_prompt_cruft_was_proposed
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      skills/deploy/SKILL.md was written for an older model: "CRITICAL: You
      MUST ALWAYS ... NEVER skip it!!", "Think step by step", "Be thorough. Do
      not be lazy. Do not stop early." At least one recorded issue points at
      that file and proposes removing or rewriting some of those lines, and
      says what the replacement is (or that the line goes). Fail if no issue
      touches the deploy skill, or if one does but only says it "could be
      clearer" with no line named and no change proposed.

  - type: llm
    name: the_load_bearing_rule_was_kept
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge the recorded issues that mention skills/deploy/SKILL.md. The deploy
      skill also says never to run ./deploy.sh without --dry-run first,
      because the staging host has no rollback. That rule carries a reason and
      a real constraint, so it stays. Fail if any issue proposes deleting it
      or dropping its reason. Rewording it more plainly while keeping both
      the rule and the reason is fine, and so is no issue mentioning it at
      all.

  - type: llm
    name: polakos_own_block_was_left_alone
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      CLAUDE.md holds the same kind of cruft ("IMPORTANT: You MUST ALWAYS run
      ./test.sh before EVERY commit!! Think step by step.") but only inside the
      <!-- polako:begin --> / <!-- polako:end --> block, which is polako's own
      text and not this repo's to fix. Fail if any recorded issue proposes
      changing a line inside that block. An issue about CLAUDE.md text outside
      the block, or a mention of the block that proposes no change, is fine.

  # A health run's whole gh surface is `gh issue list` and `gh issue create`:
  # `polako health` grants nothing else (healthTools), so an unattended run
  # that tries any other call, `gh issue view` included, gets refused.
  - type: regex
    name: nothing_but_issues_was_created
    target:
      source: file
      path: .eval/gh-calls.log
    pattern: '^gh (?!(?:(?:-R|--repo)[ =]\S+ )?issue (?:create|list)\b)'
    flags: m
    match: not_contains

  # The run reads the code and writes issue bodies. It doesn't commit, push,
  # branch or edit anything in repo/. Its one scratch file, ISSUE_BODY.md, is
  # gone by the end. Anchored to the command: the call's description is free
  # text, and "get current commit" isn't a commit (issue #702).
  - type: tool_used
    name: the_repository_was_not_written_to
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*(?:git\b(?:[^"\\]|\\.)*\b(commit|push)\b|worktree add|checkout -b|switch -c)'
    min: 0
    max: 0

  - type: tool_used
    name: no_file_was_edited
    tool: Edit
    min: 0
    max: 0

  - type: tool_used
    name: only_the_scratch_body_was_written
    tool: Write
    input_match: '"file_path":"(?!(?:[^"\\]|\\.)*ISSUE_BODY\.md")'
    min: 0
    max: 0

  - type: file_exists
    name: the_scratch_body_was_cleaned_up
    path: '**/ISSUE_BODY.md'
    exists: false
