schema_version: "1.0"
name: plan-vision
description: >
  A vision document should become proposals — every one labelled, sized and
  pointered, the epic's children parented to it, and the gap the backlog
  already covers left alone. Nothing but issues is created.
tags:
  - skill
  - planning
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /polako:plan-backlog VISION.md
  max_turns: 60
  timeout_seconds: 1800
  # planTools (plan.go). The gated ones only reach the run through
  # evals/lib/grants.sh.
  allowed_tools:
    - Read
    - Write
    - Glob
    - Grep
    - TodoWrite
    - Bash
  # The CLI turns CLAUDE.md loading off for a run, so the workspace can't say
  # where the project is. This says it instead, and moves the run there with
  # one bare cd: the grant refuses a cd chained to a git command. After it the
  # run sits where an unattended one starts.
  append_system_prompt: >
    The project to work on is the git checkout at ./repo, below the directory
    you start in, which is not the project. Make your first tool call the Bash
    command `cd repo`, alone, with nothing chained to it: that puts you in the
    checkout, where an unattended run starts. Worktrees this run creates
    belong inside the checkout, under its .worktrees/.
# .eval/issues-created.md holds every recorded issue, one after another, each
# with its number, argv, title, labels and parent lines above a --- and its
# body below.
graders:
  - type: file_exists
    name: something_was_proposed
    path: .eval/created/100.md

  - type: llm
    name: everything_carries_the_gate_label
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Every recorded issue was created with `--label proposed` — check the
      `labels:` line and the `argv:` line of each one. Fail if even one is
      missing it: the label is the only thing keeping an unattended run off an
      issue no human has approved, so one unlabelled proposal is one that gets
      worked without anybody choosing it.

  - type: llm
    name: the_epic_is_parented_correctly
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge parenting only: each recorded issue's number, its `parent:` line,
      and any `--parent` in its argv. A `--blocked-by` link is a dependency
      between issues, not parenting, and counts neither way. Either every
      created issue is flat with no `--parent` at all, or exactly one is the
      epic and the rest name it — the epic has an empty `parent:` line and the
      lowest number, and each child's `parent:` is that number. Fail if a
      child names a number that was never created, if the epic was created
      after a child that parents to it, or if two different parents appear.

  - type: llm
    name: bodies_are_complete
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Judge each recorded issue's body, below its --- line. Each body has
      Summary, Why now, Acceptance criteria, Pointers and Out of scope
      sections, one `Estimate: S|M|L — likely N runs` line, and a closing
      provenance line naming VISION.md and a short commit sha. The Pointers
      section names real files from the scratch repo (greet.sh, test.sh,
      README.md). Fail on a body that is a paragraph of prose, on an estimate
      quoting a dollar figure, or on acceptance criteria that restate the
      summary rather than saying when the issue is done.

  - type: llm
    name: the_seeded_overlap_was_not_reproposed
    focus:
      source: file
      path: .eval/issues-created.md
    criteria: >
      Open issue #1 already asks for `--help` and `-h` on greet.sh, and the
      vision document asks for the same thing. Fail only if a recorded issue
      proposes that work itself: its title or Summary asks for a help flag or
      usage output, even reworded — a duplicate costs the curator a decision
      and the queue a wasted run. An issue that mentions #1, points at it, or
      plans around it (sharing its flag parsing, say) is not a re-proposal
      and passes. Proposing the other gaps the document names (languages,
      several names, continuous integration) is correct and is not a failure
      here.

  # A plan run's entire write surface is creating labelled issues: reads plus
  # `gh issue create`, and nothing else.
  - type: regex
    name: nothing_but_issues_was_created
    target:
      source: file
      path: .eval/gh-calls.log
    pattern: '^gh (?!(?:(?:-R|--repo)[ =]\S+ )?(?:issue (?:create|list|view)|search issues)\b)'
    flags: m
    match: not_contains

  # The run reads the code and writes issue bodies. It doesn't commit, push,
  # branch or edit anything in repo/. Its one scratch file, ISSUE_BODY.md, is
  # gone by the end.
  - type: tool_used
    name: the_repository_was_not_written_to
    tool: Bash
    input_match: 'git\b(?:[^"\\]|\\.)*\b(commit|push)\b|worktree add|checkout -b|switch -c'
    min: 0
    max: 0

  - type: tool_used
    name: no_file_was_edited
    tool: Edit
    min: 0
    max: 0

  - type: tool_used
    name: only_the_scratch_body_was_written
    tool: Write
    input_match: '"file_path":"(?!(?:[^"\\]|\\.)*ISSUE_BODY\.md")'
    min: 0
    max: 0

  - type: file_exists
    name: the_scratch_body_was_cleaned_up
    path: '**/ISSUE_BODY.md'
    exists: false
