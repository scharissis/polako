name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, so an overdue release turns main red within a day even with no
    # push or PR to trigger a run (issue #387) — someone sees it instead of
    # the next PR going red for a reason its own branch can't fix.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history and tags: TestShippingFixesDoNotSitUnreleased compares main
      # against the newest release tag, and the default shallow checkout has
      # neither. The test fails loudly here rather than skipping if they are
      # missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # actions/checkout only fetches the ref the triggering event names — on
      # a pull_request run that's the merge ref, not main — so
      # TestShippingFixesDoNotSitUnreleased has no other path to origin/main's
      # own history without this.
      - name: fetch main
        run: git fetch origin main

      # Windows runners keep TEMP on C:, a much slower disk than the D: the
      # workspace is on, and every t.TempDir, git fixture copy and the fake-CLI
      # build land under TEMP. On D: the suite ran ~10s faster (56s -> 47s, two
      # paired runs). GOCACHE stays on C: on purpose: moving it changes the
      # path setup-go restores to, so the frozen cache below would miss.
      - name: move TEMP to the D drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path D:\)) {
            "no D: drive on this runner; TEMP stays on C:"
            exit 0
          }
          New-Item -ItemType Directory -Force D:\tmp | Out-Null
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
          "TMP=D:\tmp" >> $env:GITHUB_ENV

      # This cache is frozen, and that is fine. setup-go keys on a hash of
      # go.sum; stdlib-only means there is no go.sum, so the key is a constant
      # that hits every run, and on a hit the action skips saving. It holds
      # whatever the first run for that key stored, stdlib objects included —
      # the expensive part, and it never changes.
      #
      # Looks like an obvious bug. It was measured: caching GOCACHE explicitly,
      # keyed on the sources, took the Windows `go test` step from 173s to
      # 236/244/295s over three warm runs. Those runs changed no Go file, so
      # the restored cache held a result for the same test binary, and `go
      # test` then re-checks every file the last run touched before running
      # anything — the likely cost, and the same bookkeeping -count=1 turns off
      # below. Don't "fix" this without measuring Windows.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Same scoping as scripts/check.sh: gofmt, unlike go, does not skip
          # dot-directories, so list tracked files rather than passing ".".
          # git ls-files -z / xargs -0, not mapfile: keeps this correct even
          # for a tracked path containing a space, and matches check.sh so
          # the two don't drift into different idioms for the same check.
          unformatted=""
          if [ -n "$(git ls-files '*.go')" ]; then
            unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          fi
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -count=1 turns off Go's test-result cache, which CI can't use: every
      # run is a fresh checkout, and the new file times miss any cached
      # result. Left on, it cost ~80s a run on Windows, more than the suite
      # itself: go test logs every file the suite touches — ~70k paths, nearly
      # all temp dirs — and after the run checks each one with EvalSymlinks,
      # which is slow there. A second or two elsewhere.
      #
      # -vet=off because the go vet step already ran every analyzer go test
      # would; go test's own pass re-vetted ~137 stdlib packages a run.
      #
      # What's left on Windows is process spawns: ~2,000 git and ~2,400
      # fake-CLI per run, ~30ms and ~10ms apiece there. -parallel=8 took ~8s
      # more off in three paired runs but was left out: several tests race
      # process startup against 100-500ms watchdogs, and more contention on
      # four vCPUs is how those turn flaky.
      - name: go test
        run: go test -count=1 -vet=off ./...

      # The race detector needs a C toolchain on some platforms, so it runs
      # where it is cheapest and most reliable. Same flags, same reasons.
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 -vet=off ./...

      - name: go build
        run: go build ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Stdlib-only Go is the whole point: it has to build for every target.
      - name: build every target
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/polako
            echo "ok $target"
          done
