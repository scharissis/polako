name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history and tags: TestShippingFixesDoNotSitUnreleased compares main
      # against the newest release tag, and the default shallow checkout has
      # neither. The test fails loudly here rather than skipping if they are
      # missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # This cache is frozen, and that is fine. setup-go keys on a hash of
      # go.sum; stdlib-only means there is no go.sum, so the key is a constant
      # that hits every run, and on a hit the action skips saving. It has held
      # whatever the first run ever stored since — 19380376 bytes, byte for
      # byte, run after run.
      #
      # Looks like an obvious bug. It was measured, and fixing it costs a
      # minute a run on Windows: caching GOCACHE explicitly, keyed on the
      # sources, took the Windows compile from ~60s to 113/135/179s over three
      # warm runs, with the `go test` step going 173s -> 236/244/295s. The
      # stale cache already holds the stdlib objects, which are the expensive
      # part and never change; this module is ~12k lines and compiles fast. A
      # bigger restored cache only adds work — Go trims it, and deleting
      # thousands of small files on Windows is slow.
      #
      # So don't "fix" this without measuring Windows. The real cost there is
      # process spawns, not compilation: ~1,500 git calls and ~300 fake-CLI
      # ones per suite run, all serial. See issues #316 and #318.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Same scoping as scripts/check.sh: gofmt, unlike go, does not skip
          # dot-directories, so list tracked files rather than passing ".".
          # git ls-files -z / xargs -0, not mapfile: keeps this correct even
          # for a tracked path containing a space, and matches check.sh so
          # the two don't drift into different idioms for the same check.
          unformatted=""
          if [ -n "$(git ls-files '*.go')" ]; then
            unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          fi
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The race detector needs a C toolchain on some platforms, so it runs
      # where it is cheapest and most reliable.
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: go build
        run: go build ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Stdlib-only Go is the whole point: it has to build for every target.
      - name: build every target
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/polako
            echo "ok $target"
          done
