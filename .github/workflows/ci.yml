name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history and tags: TestShippingFixesDoNotSitUnreleased compares main
      # against the newest release tag, and the default shallow checkout has
      # neither. The test fails loudly here rather than skipping if they are
      # missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # cache: false, because setup-go's own caching cannot work here. It keys
      # on a hash of go.sum, and stdlib-only means there is no go.sum — so the
      # key is a constant, hits every run, and on a hit the action skips
      # saving. The cache stayed frozen at whatever the first run stored:
      # 19380376 bytes, byte for byte, run after run, while Windows recompiled
      # from cold every time. The explicit cache below keys on the sources
      # instead, so it actually re-saves.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: locate the build cache
        id: gocache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # restore-keys is what makes this pay: the stdlib objects dominate the
      # cache and almost never change, so a near-miss on the exact key still
      # restores the expensive part and leaves only this module to compile.
      # go.mod is in the hash, so a toolchain bump invalidates it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Same scoping as scripts/check.sh: gofmt, unlike go, does not skip
          # dot-directories, so list tracked files rather than passing ".".
          # git ls-files -z / xargs -0, not mapfile: keeps this correct even
          # for a tracked path containing a space, and matches check.sh so
          # the two don't drift into different idioms for the same check.
          unformatted=""
          if [ -n "$(git ls-files '*.go')" ]; then
            unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          fi
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The race detector needs a C toolchain on some platforms, so it runs
      # where it is cheapest and most reliable.
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: go build
        run: go build ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Its own key prefix, not the test job's: this job's cache is five
      # targets' worth of cross-compiled objects, and sharing a prefix would
      # have the two jobs restoring each other's near-misses all day.
      - name: locate the build cache
        id: gocache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: go-cross-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-cross-

      # Stdlib-only Go is the whole point: it has to build for every target.
      - name: build every target
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/polako
            echo "ok $target"
          done
