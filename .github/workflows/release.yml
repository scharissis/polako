name: Release

# Builds and publishes one tagged release, however the tag arrived: pushed by
# hand from scripts/release.sh, or created by cut-release.yml — which has to
# dispatch this workflow explicitly, because a tag pushed with the workflow
# token never triggers another workflow's push trigger. Both entry points
# behave identically, and the run is idempotent: re-dispatching it on the same
# tag skips whatever already exists and finishes what is missing.

on:
  push:
    tags: ["v*"]
  # For cut-release.yml, and for re-runs by hand: dispatch it on the vX.Y.Z
  # tag ref. Anything else is refused below rather than publishing a release
  # named after a branch.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: refuse a non-tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::this workflow releases the tag it runs on — re-run it with a vX.Y.Z tag selected as the ref, or let cut-release.yml dispatch it"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The hermetic suite can only guard the manifest keys it already knows
      # about; this is the check that catches everything else the plugin
      # tooling rejects. It gates the release rather than every PR because a
      # mismatch between plugin.json and the marketplace entry is what
      # `claude plugin tag` refuses to release on, and because pinning routine
      # PRs to Claude Code's release cadence would stall the queue for changes
      # nowhere near the manifests. Unpinned so it reflects what a user's own
      # tooling will do; pin it here if a validator change ever blocks a
      # release for an unrelated reason.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: build binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/polako_${GITHUB_REF_NAME}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            # Stamped with the tag: `go build` from a checkout records the
            # revision but leaves the module version at "(devel)", so without
            # this every published binary reports a bare SHA and no recorded
            # run can be attributed to a release.
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/polako
          done
          ls -l dist

      # The changelog section is what says whether a release changes anything an
      # operator has to know about before upgrading a machine that works a backlog
      # overnight; a list of commit subjects buries exactly that. Falling back to
      # generated notes rather than failing, because a release that is already
      # tagged and built should not be held up by its own prose.
      - name: extract release notes
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          : > notes.md
          # Guarded rather than relied upon: this step runs under `set -eo
          # pipefail`, so a tag pushed by hand onto a commit with no changelog
          # would fail here instead of falling back — after both tags are
          # public and the binaries are built.
          if [ -f CHANGELOG.md ]; then
            # Drop the section's own heading and the next one the range pulled
            # in. Both are conditional so the oldest section, which no later
            # heading terminates, does not lose its last line.
            sed -n "/^## \[*${version}\]*/,/^## /p" CHANGELOG.md \
              | sed -e '1{/^## /d;}' -e '${/^## /d;}' > notes.md
          fi
          if [ -s notes.md ]; then
            echo "NOTES_ARG=--notes-file=notes.md" >> "$GITHUB_ENV"
            cat notes.md
          else
            echo "no CHANGELOG.md section for $version; falling back to generated notes"
            echo "NOTES_ARG=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Already-published is the normal state on a re-run, and skipping it
          # is what lets a re-dispatch repair only what is missing.
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
          else
            gh release create "$GITHUB_REF_NAME" dist/* "$NOTES_ARG"
          fi

      - name: start a smoke run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tags and the published release are what smoke.sh checks, so
          # this is the first moment it can be asked. Advisory by design: its
          # verdict gates the publish PR in a human's hands, not this
          # workflow, and a red smoke run un-publishes nothing.
          gh workflow run smoke.yml --ref main -f "version=${GITHUB_REF_NAME#v}"

      - name: open the publish PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          branch="publish-$version"
          ref="polako--v$version"
          git fetch origin main
          current=$(git show FETCH_HEAD:.claude-plugin/marketplace.json \
            | jq -r '.plugins[] | select(.name == "polako") | .source.ref')
          if [ "$current" = "$ref" ]; then
            echo "the marketplace entry already pins $ref: $version is published"
            exit 0
          fi
          open=$(gh pr list --head "$branch" --state open --json url --jq '.[].url')
          if [ -n "$open" ]; then
            echo "a publish PR for $version is already open: $open"
            exit 0
          fi
          # A previous run may have pushed the branch and then died before
          # its PR opened. The workflow's own scaffold is regenerated here,
          # so it is swept aside; a branch carrying anybody else's commits is
          # not this workflow's to delete.
          if [ -n "$(git ls-remote origin "refs/heads/$branch")" ]; then
            committer=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" \
              --jq .commit.committer.email 2>/dev/null || true)
            if [ "$committer" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              echo "deleting the publish branch $branch a previous run left behind"
              git push origin ":refs/heads/$branch"
            else
              echo "::error::branch $branch already exists with commits this workflow did not make — open a PR from it, or delete it (git push origin :$branch) and re-run this workflow on the tag"
              exit 1
            fi
          fi

          # The one-line ref move, branched from main rather than from the tag
          # so it carries nothing but the publish. Merging it is the moment
          # anybody is exposed to the release, which is exactly why a workflow
          # may open it and only a human may merge it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch" FETCH_HEAD
          sed -i 's|"ref": *"[^"]*"|"ref": "'"$ref"'"|' .claude-plugin/marketplace.json
          git commit -am "chore: publish $version — move the marketplace ref to $ref"
          git push origin "$branch"

          {
            echo "Merging this one line is the act of publishing $version: installs"
            echo "resolve the marketplace ref, so nobody is on the release until this"
            echo "lands. Rolling back later is reverting this commit; tags never move."
            echo
            echo "Before merging:"
            echo
            echo "- **Check the [Smoke run](https://github.com/$GITHUB_REPOSITORY/actions/workflows/smoke.yml)**"
            echo "  dispatched for $GITHUB_REF_NAME — it covers the tags, the"
            echo "  [release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)"
            echo "  and its five binaries, \`go install\`, and a plugin install with this"
            echo "  very ref moved."
            echo "- **If the skill half changed, drive one real issue through $version"
            echo "  first** and note here which one — see \"Smoke-testing the skill\" in"
            echo "  the README. If the backlog was empty, say that instead."
            echo
            echo "CI does not start on its own for a PR a workflow opens; a run was"
            echo "dispatched for this branch, and any push to it triggers CI normally."
          } > body.md
          if ! gh pr create --base main --head "$branch" \
              --title "chore: publish $version" --body-file body.md; then
            # Leave nothing behind, and name the usual one-checkbox fix.
            git push origin ":refs/heads/$branch"
            echo "::error::could not open the publish PR; the branch was deleted again. If the error above says GitHub Actions is not permitted to create pull requests, enable it once — Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests' — then re-run this workflow on the tag."
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
