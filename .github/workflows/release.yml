name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The hermetic suite can only guard the manifest keys it already knows
      # about; this is the check that catches everything else the plugin
      # tooling rejects. It gates the release rather than every PR because a
      # mismatch between plugin.json and the marketplace entry is what
      # `claude plugin tag` refuses to release on, and because pinning routine
      # PRs to Claude Code's release cadence would stall the queue for changes
      # nowhere near the manifests. Unpinned so it reflects what a user's own
      # tooling will do; pin it here if a validator change ever blocks a
      # release for an unrelated reason.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: build binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/backlog-drain_${GITHUB_REF_NAME}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/backlog-drain
          done
          ls -l dist

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
