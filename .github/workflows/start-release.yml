name: Start a release

# The entry point of the release pipeline: run it from the Actions tab, pick a
# bump, and it opens the release PR — plugin.json bumped, CHANGELOG.md given a
# section of GitHub's own release notes for the range: every merged PR as a
# linked bullet with its author and the issues it closed, capped by a compare
# link. Reading that section, adding prose where a change deserves it, and
# merging the PR is the human half; cut-release.yml takes over from the merge.
# Nothing here releases anything: a PR this workflow opens can sit, be edited,
# or be closed unmerged, and nobody downstream ever sees it.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump — pre-1.0, minor is the breaking axis (see What to bump in the README)"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Explicit X.Y.Z instead of a bump (leave empty to use the bump)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: start-release

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: the previous release's tag has to be visible locally to
      # be named as the floor of the release-notes range.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: pick the next version
        id: version
        env:
          # Through the environment rather than interpolated into the script,
          # so a crafted input is a value, never shell.
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current=$(jq -r .version .claude-plugin/plugin.json)
          next=$INPUT_VERSION
          if [ -z "$next" ]; then
            IFS=. read -r maj min pat <<<"$current"
            case "$INPUT_BUMP" in
              major) next=$((maj + 1)).0.0 ;;
              minor) next=$maj.$((min + 1)).0 ;;
              patch) next=$maj.$min.$((pat + 1)) ;;
            esac
          fi
          if ! printf '%s' "$next" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$next\" is not an X.Y.Z version"
            exit 1
          fi
          if [ "$next" = "$current" ]; then
            echo "::error::the version is already $current — pick a bump, or a different explicit version"
            exit 1
          fi
          if [ -n "$(git ls-remote origin "refs/tags/v$next")" ]; then
            echo "::error::v$next is already tagged; a tag never moves, so releasing again needs a new number"
            exit 1
          fi
          open=$(gh pr list --head "release-$next" --state open --json url --jq '.[].url')
          if [ -n "$open" ]; then
            echo "::error::a release PR for $next is already open — edit and merge that one: $open"
            exit 1
          fi
          # A previous run may have pushed the branch and then died before its
          # PR opened — the createPullRequest permission being off is the
          # usual cause. A scaffold nobody has touched is regenerated from
          # main, so sweeping it aside loses nothing; a branch carrying
          # anybody else's commits is not this workflow's to delete.
          if [ -n "$(git ls-remote origin "refs/heads/release-$next")" ]; then
            # `|| committer=""` and not `|| true`: a failed gh api prints its
            # error envelope to stdout, and capturing that would read as a
            # human committer and refuse a branch this workflow owns.
            committer=$(gh api "repos/$GITHUB_REPOSITORY/commits/release-$next" \
              --jq .commit.committer.email 2>/dev/null) || committer=""
            if [ "$committer" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              echo "deleting the scaffold branch release-$next a previous run left behind"
              git push origin ":refs/heads/release-$next"
            else
              echo "::error::branch release-$next already exists with commits this workflow did not make — open a PR from it, or delete it (git push origin :release-$next) and re-run"
              exit 1
            fi
          fi
          {
            echo "current=$current"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"

      - name: open the release PR
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
          # Opened with the operator's own token when the repo has one:
          # GitHub holds the pull_request workflows of every bot-authored PR
          # behind an "Approve workflows to run" button on a private repo,
          # with no setting to waive it. A RELEASE_TOKEN secret (fine-grained
          # PAT: this repo, Contents and Pull requests read/write) makes the
          # PRs the operator's and the button disappears. The workflow token
          # is the fallback, so the pipeline still works — bot-authored, one
          # approval click per PR — where no secret is configured.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          # The section is GitHub's own release notes for the range: every
          # merged PR as a linked bullet with its author, capped by a compare
          # link — the same material a plain-subjects dump buried. Generated
          # here, into the PR, rather than at publish time, so the notes are
          # readable and editable before anything is cut. The previous cycle's
          # release and publish PRs are this pipeline's own plumbing, not
          # changes anyone upgrades for, so their bullets are dropped.
          args=(-f "tag_name=v$NEXT" -f "target_commitish=$GITHUB_SHA")
          if git rev-parse -q --verify "refs/tags/v$CURRENT^{commit}" >/dev/null; then
            args+=(-f "previous_tag_name=v$CURRENT")
          fi
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq .body)

          # A bullet names a PR; the issues that PR closed are what the
          # backlog actually tracks, so each bullet is annotated with them —
          # that is what makes "was #166 in this release?" answerable by
          # searching the notes. Best effort per line: a lookup that fails
          # leaves its bullet bare rather than failing the release over an
          # annotation.
          enrich() {
            while IFS= read -r line; do
              case "$line" in
              \**/pull/*)
                pr=${line##*/pull/}
                pr=${pr%%[!0-9]*}
                closes=$(gh pr view "$pr" --json closingIssuesReferences \
                  --jq '[.closingIssuesReferences[].number] | map("#\(.)") | join(", ")' \
                  2>/dev/null) || closes=""
                if [ -n "$closes" ]; then
                  line="$line (closes $closes)"
                fi
                ;;
              esac
              printf '%s\n' "$line"
            done
          }
          {
            echo "## [$NEXT]"
            echo
            # Headings demoted one level to sit under the version heading,
            # which is the boundary the release workflow's section extraction
            # keys on.
            printf '%s\n' "$notes" \
              | sed 's/^## /### /' \
              | grep -vE '^\* chore: publish |^\* chore\(release\): ' \
              | enrich
          } > /tmp/section.md

          awk 'NR==FNR { section = section $0 ORS; next }
               !done && /^## / { printf "%s", section; print ""; done = 1 }
               { print }' /tmp/section.md CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md
          sed -i 's/"version": *"[^"]*"/"version": "'"$NEXT"'"/' .claude-plugin/plugin.json

          # One commit that bumps plugin.json and writes the section, and does
          # nothing else — the convention the repo's release history keeps, so
          # a commit exists that means "this is $NEXT".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release-$NEXT"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): $NEXT"
          git push origin "release-$NEXT"

          {
            echo "Starts the release of $NEXT. **Merging this PR is what cuts it.**"
            echo
            echo "The CHANGELOG.md section in the diff is the release notes: every PR"
            echo "since v$CURRENT, linked, with its author and the issues it closed."
            echo "Add an **Operator impact** line if this release changes what an"
            echo "unattended run does (the changelog's own preamble says why), edit"
            echo "anything else that deserves prose, then merge."
            echo
            echo "From the merge, the rest is automatic: *Cut a release* tags the merge"
            echo "commit twice, *Release* builds the five binaries and publishes the"
            echo "GitHub release with this changelog section as its body, a *Smoke* run"
            echo "starts, and a publish PR opens. Nobody is on $NEXT until that publish"
            echo "PR merges, so this PR can sit, be edited, or be closed unmerged"
            echo "without anyone seeing a release."
          } > /tmp/body.md
          if ! gh pr create --base main --head "release-$NEXT" \
              --title "chore(release): $NEXT" --body-file /tmp/body.md; then
            # Leave nothing behind: a failed run that keeps its branch makes
            # the re-run fail differently, which reads as a second bug. The
            # usual cause has a one-checkbox fix, so name it.
            git push origin ":refs/heads/release-$NEXT"
            echo "::error::could not open the release PR; the scaffold branch was deleted again. If the error above says GitHub Actions is not permitted to create pull requests, enable it once — Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests' — then re-run this workflow."
            exit 1
          fi

          # A PR opened with the operator's token triggers pull_request CI by
          # itself. Only the bot-authored fallback needs this explicit
          # dispatch — GitHub suppresses runs for events the workflow token
          # caused — and it runs under the workflow token, since the
          # fine-grained PAT is deliberately not granted Actions access.
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            GH_TOKEN=$WORKFLOW_TOKEN gh workflow run ci.yml --ref "release-$NEXT"
          fi
