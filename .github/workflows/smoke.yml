name: Smoke

# scripts/smoke.sh, run where the release pipeline can start it: release.yml
# dispatches it the moment a release is published, and the Actions tab re-runs
# it by hand for any version. Advisory by design — a red run here blocks
# nothing by itself; it is the evidence the publish PR asks a human to read
# before merging. The script writes nothing outside a temporary directory, so
# running it here moves no machine, and no user, onto the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to smoke-test, e.g. 0.8.0"
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: install claude
        run: npm install -g @anthropic-ai/claude-code

      # The script's own `go install` borrows gh's token, but the plugin
      # checks have claude clone this repository itself, outside the checkout
      # the runner authenticated. On a private repository that clone needs a
      # credential, so let gh answer git's credential prompts for github.com
      # — it holds the workflow token — and rewrite the ssh URL forms down to
      # https, since a clone the CLI spells over ssh has no key here to use.
      # The runner is thrown away with the config.
      - name: let claude clone this repository
        run: |
          gh auth setup-git
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: smoke-test the release
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/smoke.sh "$VERSION"
